<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Qué miramo? | Mi relación con YouTube</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #f8f9fc;
      --foreground: #1a1d2e;
      --muted-foreground: #6b7280;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--background);
      color: var(--foreground);
    }

    .font-heading { font-family: 'Space Grotesk', sans-serif; }

    .hero {
      padding: 80px 20px;
      text-align: center;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 700;
    }

    .hero-description {
      margin-top: 10px;
      color: var(--muted-foreground);
    }

    .main-content {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 0 20px 60px;
    }

    .charts-container {
      display: flex;
      flex-direction: column;
      gap: 60px;
    }

    .chart-section { width: 100%; }

    .chart-header {
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .chart-title {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .chart-description {
      font-size: 0.95rem;
      color: var(--muted-foreground);
      margin-top: 4px;
    }

    .chart-body { width: 100%; }
  </style>
</head>

<body>

<header class="hero">
  <h1 class="hero-title font-heading">¿Qué miramo?</h1>
  <p class="hero-description">Mi relación con YouTube</p>
</header>

<main class="main-content">
  <div class="charts-container">

    <!-- CHART 1 -->
    <div class="chart-section">
      <div class="chart-header">
        <h2 class="chart-title">¿Qué tipo de contenido consumo?</h2>
        <p class="chart-description">Distribución por categoría</p>
      </div>
      <div class="chart-body">
        <div class="flourish-embed" data-src="visualisation/28160412">
          <script src="https://public.flourish.studio/resources/embed.js"></script>
        </div>
      </div>
    </div>

    <!-- CHART 2 -->
    <div class="chart-section">
      <div class="chart-header">
        <h2 class="chart-title">¿Qué días miro más YouTube?</h2>
        <p class="chart-description">Consumo semanal</p>
      </div>
      <div class="chart-body">
        <div class='tableauPlaceholder' id='viz1774313988468' style='position: relative; width: 100%;'>
          <noscript><a href='#'><img alt='Dashboard 2' src='https://public.tableau.com/static/images/Gr/Graficos__Finales/Dashboard2/1_rss.png' style='border: none' /></a></noscript>
          <object class='tableauViz' style='display:none;'>
            <param name='host_url' value='https%3A%2F%2Fpublic.tableau.com%2F' />
            <param name='embed_code_version' value='3' />
            <param name='site_root' value='' />
            <param name='name' value='Graficos__Finales&#47;Dashboard2' />
            <param name='tabs' value='no' />
            <param name='toolbar' value='yes' />
            <param name='static_image' value='https://public.tableau.com/static/images/Gr/Graficos__Finales/Dashboard2/1.png' />
            <param name='animate_transition' value='yes' />
            <param name='display_static_image' value='yes' />
            <param name='display_spinner' value='yes' />
            <param name='display_overlay' value='yes' />
            <param name='display_count' value='yes' />
            <param name='language' value='en-US' />
          </object>
        </div>
        <script type='text/javascript'>
          var divElement = document.getElementById('viz1774313988468');
          var vizElement = divElement.getElementsByTagName('object')[0];
          function resizeViz2() {
            var w = divElement.offsetWidth;
            vizElement.style.width = '100%';
            vizElement.style.height = (w > 500 ? Math.round(w * 0.75) : 727) + 'px';
          }
          resizeViz2();
          window.addEventListener('resize', resizeViz2);
          var s2 = document.createElement('script');
          s2.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
          vizElement.parentNode.insertBefore(s2, vizElement);
        </script>
      </div>
    </div>

    <!-- CHART 3 -->
    <div class="chart-section">
      <div class="chart-header">
        <h2 class="chart-title">Video viewed by channel</h2>
        <p class="chart-description">Distribución por canal</p>
      </div>
      <div class="chart-body">
        <div id="viz2" style="position: relative; width: 100%;">
          <object class="tableauViz" style="display:none;">
            <param name="host_url" value="https://public.tableau.com/">
            <param name="name" value="otrografico/Dashboard1">
          </object>
        </div>
        <script>
          (function() {
            var div = document.getElementById('viz2');
            var viz = div.getElementsByTagName('object')[0];
            function resizeViz3() {
              viz.style.width = '100%';
              viz.style.height = (window.innerWidth > 900 ? 900 : 700) + 'px';
            }
            resizeViz3();
            window.addEventListener('resize', resizeViz3);
            var s3 = document.createElement('script');
            s3.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
            viz.parentNode.insertBefore(s3, viz);
          })();
        </script>
      </div>
    </div>

  </div>
</main>

</body>
</html>
